<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Audio">
    <title>Audio Library</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
            background: #0a0a0a;
            color: #e5e5e5;
            min-height: 100vh;
            padding: 0 0 140px 0;
        }
        .header {
            padding: 60px 20px 12px;
            background: linear-gradient(180deg, #1a1a2e 0%, #0a0a0a 100%);
        }
        .header h1 {
            font-size: 29px;
            font-weight: 700;
            color: #fff;
        }
        .header p {
            font-size: 15px;
            color: #888;
            margin-top: 4px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            padding: 8px 16px 0;
            gap: 0;
            border-bottom: 1px solid #222;
            background: #0a0a0a;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .tab {
            flex: 1;
            padding: 12px 0;
            background: none;
            border: none;
            color: #666;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .tab.active {
            color: #fff;
            border-bottom-color: #667eea;
        }

        /* Content sections */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .reports {
            padding: 12px 16px;
        }
        .report-card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .report-card:active {
            background: #252525;
        }
        .report-card.playing {
            background: #1a1a2e;
            border: 1px solid #3b3b6d;
        }
        .report-icon {
            width: 52px;
            height: 52px;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }
        .report-icon.article-icon {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .report-info {
            flex: 1;
            min-width: 0;
        }
        .report-title {
            font-size: 17px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .report-meta {
            font-size: 14px;
            color: #888;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .play-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .play-btn svg {
            width: 18px;
            height: 18px;
            fill: #000;
        }
        .share-btn, .pdf-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: none;
            cursor: pointer;
        }
        .pdf-btn {
            background: #1a365d;
        }
        .share-btn svg, .pdf-btn svg {
            width: 18px;
            height: 18px;
            fill: #fff;
        }

        /* Player bar */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1c1c1e;
            border-top: 1px solid #333;
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
            display: none;
            z-index: 20;
        }
        .player-bar.active { display: block; }
        .player-title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
        }
        .player-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .ctrl-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
        }
        .progress-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .progress-bar {
            flex: 1;
            height: 4px;
            background: #444;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: #667eea;
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s linear;
        }
        .time-label {
            font-size: 11px;
            color: #888;
            min-width: 36px;
            text-align: center;
        }
        .speed-btn {
            background: #333;
            border: none;
            color: #fff;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* FAB */
        .fab {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: #fff;
            font-size: 32px;
            font-weight: 300;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
            z-index: 15;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .fab:active {
            transform: scale(0.92);
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            align-items: flex-end;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #1c1c1e;
            border-radius: 16px 16px 0 0;
            padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
            width: 100%;
            max-width: 500px;
        }
        .modal h2 {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 16px;
        }
        .modal input[type="url"] {
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #2c2c2e;
            color: #fff;
            font-size: 16px;
            outline: none;
            margin-bottom: 12px;
        }
        .modal input[type="url"]::placeholder {
            color: #666;
        }
        .modal input[type="url"]:focus {
            border-color: #667eea;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
        }
        .modal-btn {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .modal-btn.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        .modal-btn.secondary {
            background: #333;
            color: #fff;
        }
        .modal-status {
            margin-top: 12px;
            font-size: 14px;
            color: #888;
            text-align: center;
            min-height: 20px;
        }
        .modal-status.success { color: #4cd964; }
        .modal-status.error { color: #ff3b30; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .empty-state p { font-size: 15px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Audio Library</h1>
        <p id="subtitle">Loading...</p>
    </div>

    <div class="tabs">
        <button class="tab active" data-tab="research">Research</button>
        <button class="tab" data-tab="articles">Articles</button>
    </div>

    <div class="tab-content active" id="research-tab">
        <div class="reports" id="reports"></div>
    </div>

    <div class="tab-content" id="articles-tab">
        <div class="reports" id="articles"></div>
    </div>

    <button class="fab" id="addBtn">+</button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2>Add Article</h2>
            <input type="url" id="urlInput" placeholder="Paste article URL..." autocapitalize="off" autocorrect="off">
            <div class="modal-buttons">
                <button class="modal-btn secondary" id="cancelBtn">Cancel</button>
                <button class="modal-btn primary" id="submitBtn">Submit</button>
            </div>
            <div class="modal-status" id="modalStatus"></div>
        </div>
    </div>

    <div class="player-bar" id="playerBar">
        <div class="player-title" id="playerTitle">&mdash;</div>
        <div class="player-controls">
            <button class="ctrl-btn" id="rewindBtn">&#x23EA;</button>
            <button class="ctrl-btn" id="playPauseBtn">&#x25B6;&#xFE0F;</button>
            <button class="ctrl-btn" id="forwardBtn">&#x23E9;</button>
            <div class="progress-container">
                <span class="time-label" id="currentTime">0:00</span>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span class="time-label" id="totalTime">0:00</span>
            </div>
            <button class="speed-btn" id="speedBtn">1x</button>
        </div>
    </div>

    <script>
        const AUDIO_BASE = 'audio/';
        // --- Configuration ---
        // Replace with your fine-grained GitHub PAT (scope: Actions read/write on this repo only)
        const GH_TOKEN = localStorage.getItem('gh_token') || '';
        const GH_OWNER = 'LowellGeorge';
        const GH_REPO = 'investment-research';
        const GH_WORKFLOW = 'process-article.yml';

        let research = [];
        let articles = [];
        let allItems = [];      // unified playlist
        let audio = new Audio();
        let currentIndex = null; // index into allItems
        let currentTab = 'research';
        const speeds = [0.75, 1, 1.25, 1.5, 1.75, 2];
        let speedIdx = 1;

        // Load both manifests in parallel
        Promise.all([
            fetch('manifest.json').then(r => r.json()).catch(() => []),
            fetch('articles-manifest.json').then(r => r.json()).catch(() => []),
        ]).then(([r, a]) => {
            research = r.map(item => ({ ...item, category: 'research' }))
                .sort((a, b) => a.name.localeCompare(b.name));
            articles = a.map(item => ({
                name: item.title,
                file: item.file,
                emoji: '',
                date: item.date || '',
                author: item.author || '',
                url: item.url || '',
                category: 'articles',
            }));
            allItems = [...research, ...articles];
            render();
        });

        function render() {
            renderResearch();
            renderArticles();
            updateSubtitle();
        }

        function updateSubtitle() {
            const n = currentTab === 'research' ? research.length : articles.length;
            const label = currentTab === 'research' ? 'report' : 'article';
            document.getElementById('subtitle').textContent =
                `${n} ${label}${n !== 1 ? 's' : ''}`;
        }

        function renderResearch() {
            const el = document.getElementById('reports');
            if (!research.length) {
                el.innerHTML = '<div class="empty-state"><p>No research reports yet.</p></div>';
                return;
            }
            el.innerHTML = research.map((r, i) => cardHTML(r, globalIndex('research', i), false)).join('');
        }

        function renderArticles() {
            const el = document.getElementById('articles');
            if (!articles.length) {
                el.innerHTML = '<div class="empty-state"><p>No articles yet. Tap + to add one.</p></div>';
                return;
            }
            el.innerHTML = articles.map((a, i) => cardHTML(a, globalIndex('articles', i), true)).join('');
        }

        function globalIndex(category, localIdx) {
            if (category === 'research') return localIdx;
            return research.length + localIdx;
        }

        function cardHTML(item, idx, isArticle) {
            const icon = isArticle
                ? `<div class="report-icon article-icon">&#x1F4D6;</div>`
                : `<div class="report-icon">${item.emoji || '&#x1F4CA;'}</div>`;
            const meta = isArticle
                ? [item.author, item.date].filter(Boolean).join(' &middot; ')
                : [item.date, item.duration].filter(Boolean).join(' &middot; ');
            const pdfBtn = item.pdf
                ? `<button class="pdf-btn" onclick="event.stopPropagation(); sharePdf(${idx})" title="PDF">
                    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zm-1 2l5 5h-5V4zM9.5 14.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5S11.83 16 11 16s-1.5-.67-1.5-1.5zm-2 2c0-.83.67-1.5 1.5-1.5h4c.83 0 1.5.67 1.5 1.5v.5H7.5v-.5z"/></svg>
                  </button>`
                : '';
            return `
                <div class="report-card" id="card-${idx}">
                    ${icon}
                    <div class="report-info" onclick="playItem(${idx})">
                        <div class="report-title">${item.name}</div>
                        <div class="report-meta">${meta}</div>
                    </div>
                    ${pdfBtn}
                    <button class="share-btn" onclick="event.stopPropagation(); shareItem(${idx})" title="Share">
                        <svg viewBox="0 0 24 24"><path d="M16 5l-1.42 1.42-1.59-1.59V16h-1.98V4.83L9.42 6.42 8 5l4-4 4 4zm4 5v11a2 2 0 01-2 2H6a2 2 0 01-2-2V10c0-1.11.89-2 2-2h3v2H6v11h12V10h-3V8h3a2 2 0 012 2z"/></svg>
                    </button>
                    <div class="play-btn" onclick="playItem(${idx})">
                        <svg viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
                    </div>
                </div>`;
        }

        function playItem(idx) {
            const item = allItems[idx];
            if (!item) return;
            if (currentIndex === idx && !audio.paused) {
                audio.pause();
                updatePlayState();
                return;
            }
            currentIndex = idx;
            audio.src = AUDIO_BASE + item.file;
            audio.playbackRate = speeds[speedIdx];
            audio.play();
            document.getElementById('playerTitle').textContent = item.name;
            document.getElementById('playerBar').classList.add('active');
            updatePlayState();
        }

        function updatePlayState() {
            document.getElementById('playPauseBtn').textContent = audio.paused ? '\u25B6\uFE0F' : '\u23F8\uFE0F';
            document.querySelectorAll('.report-card').forEach(c => {
                const id = parseInt(c.id.replace('card-', ''));
                c.classList.toggle('playing', id === currentIndex && !audio.paused);
            });
        }

        // Player controls
        document.getElementById('playPauseBtn').onclick = () => {
            if (audio.paused) audio.play(); else audio.pause();
            updatePlayState();
        };
        document.getElementById('rewindBtn').onclick = () => { audio.currentTime = Math.max(0, audio.currentTime - 30); };
        document.getElementById('forwardBtn').onclick = () => { audio.currentTime += 30; };
        document.getElementById('speedBtn').onclick = () => {
            speedIdx = (speedIdx + 1) % speeds.length;
            audio.playbackRate = speeds[speedIdx];
            document.getElementById('speedBtn').textContent = speeds[speedIdx] + 'x';
        };
        document.getElementById('progressBar').onclick = (e) => {
            const pct = e.offsetX / e.currentTarget.offsetWidth;
            audio.currentTime = pct * audio.duration;
        };

        audio.ontimeupdate = () => {
            if (!audio.duration) return;
            document.getElementById('progressFill').style.width =
                (audio.currentTime / audio.duration * 100) + '%';
            document.getElementById('currentTime').textContent = fmtTime(audio.currentTime);
            document.getElementById('totalTime').textContent = fmtTime(audio.duration);
        };
        audio.onplay = updatePlayState;
        audio.onpause = updatePlayState;
        audio.onended = () => {
            // Play next within same category
            const item = allItems[currentIndex];
            if (!item) return;
            const isResearch = currentIndex < research.length;
            const limit = isResearch ? research.length : allItems.length;
            if (currentIndex + 1 < limit) playItem(currentIndex + 1);
            else updatePlayState();
        };

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.onclick = () => {
                currentTab = tab.dataset.tab;
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById(currentTab + '-tab').classList.add('active');
                updateSubtitle();
            };
        });

        // Share PDF
        async function sharePdf(idx) {
            const item = allItems[idx];
            if (!item || !item.pdf) return;
            const pdfUrl = window.location.href.replace(/\/[^/]*$/, '/') + 'pdfs/' + item.pdf;

            if (navigator.share) {
                try {
                    const resp = await fetch('pdfs/' + item.pdf);
                    if (resp.ok) {
                        const blob = await resp.blob();
                        const file = new File([blob], item.name + ' Analysis.pdf', { type: 'application/pdf' });
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            await navigator.share({ title: item.name + ' Analysis', files: [file] });
                            return;
                        }
                    }
                } catch (e) { /* fall through */ }

                try {
                    await navigator.share({ title: item.name + ' Analysis', url: pdfUrl });
                    return;
                } catch (e) {
                    if (e.name === 'AbortError') return;
                }
            }

            // Fallback: open PDF in new tab
            window.open(pdfUrl, '_blank');
        }

        // Share audio
        async function shareItem(idx) {
            const item = allItems[idx];
            const shareFile = item.file.replace('.mp3', '.m4a');
            const audioUrl = window.location.href.replace(/\/$/, '') + '/' + AUDIO_BASE + item.file;

            if (navigator.share) {
                try {
                    const resp = await fetch(AUDIO_BASE + shareFile);
                    if (resp.ok) {
                        const blob = await resp.blob();
                        const file = new File([blob], item.name + '.m4a', { type: 'audio/mp4' });
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            await navigator.share({ title: item.name, files: [file] });
                            return;
                        }
                    }
                } catch (e) { /* fall through */ }

                try {
                    await navigator.share({ title: item.name, url: audioUrl });
                    return;
                } catch (e) {
                    if (e.name === 'AbortError') return;
                }
            }

            try {
                await navigator.clipboard.writeText(audioUrl);
                alert('Link copied!');
            } catch (e) {
                prompt('Copy link:', audioUrl);
            }
        }

        // Add article modal
        const modal = document.getElementById('modalOverlay');
        const urlInput = document.getElementById('urlInput');
        const status = document.getElementById('modalStatus');

        document.getElementById('addBtn').onclick = () => {
            modal.classList.add('active');
            urlInput.value = '';
            status.textContent = '';
            status.className = 'modal-status';
            setTimeout(() => urlInput.focus(), 100);
        };

        document.getElementById('cancelBtn').onclick = closeModal;
        modal.onclick = (e) => { if (e.target === modal) closeModal(); };

        function closeModal() {
            modal.classList.remove('active');
            urlInput.value = '';
            status.textContent = '';
        }

        document.getElementById('submitBtn').onclick = submitUrl;
        urlInput.onkeydown = (e) => { if (e.key === 'Enter') submitUrl(); };

        async function submitUrl() {
            const url = urlInput.value.trim();
            if (!url) {
                status.textContent = 'Please enter a URL';
                status.className = 'modal-status error';
                return;
            }

            try { new URL(url); } catch {
                status.textContent = 'Please enter a valid URL';
                status.className = 'modal-status error';
                return;
            }

            const token = GH_TOKEN || prompt('Enter your GitHub token (stored locally):');
            if (!token) return;
            if (!GH_TOKEN) localStorage.setItem('gh_token', token);

            status.textContent = 'Submitting...';
            status.className = 'modal-status';
            document.getElementById('submitBtn').disabled = true;

            try {
                const resp = await fetch(
                    `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/actions/workflows/${GH_WORKFLOW}/dispatches`,
                    {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            ref: 'main',
                            inputs: { url },
                        }),
                    }
                );

                if (resp.status === 204) {
                    status.textContent = 'Submitted! Audio will appear in a few minutes.';
                    status.className = 'modal-status success';
                    setTimeout(closeModal, 2000);
                } else {
                    const err = await resp.json().catch(() => ({}));
                    throw new Error(err.message || `HTTP ${resp.status}`);
                }
            } catch (e) {
                status.textContent = 'Error: ' + e.message;
                status.className = 'modal-status error';
            } finally {
                document.getElementById('submitBtn').disabled = false;
            }
        }

        function fmtTime(s) {
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return m + ':' + (sec < 10 ? '0' : '') + sec;
        }
    </script>
</body>
</html>
